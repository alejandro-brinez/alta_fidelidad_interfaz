<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Campus Verde · Notas del docente</title>
<style>
:root{--bg:#f2f6f3;--card:#fff;--ink:#17261d;--mut:#5c6f63;--line:#d6e2da;--pri:#0b7a3e;--pri2:#e6f4ec;--err:#b42318;--warn:#9a5b00;--sh:0 2px 10px rgba(11,60,30,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#17211b;--ink:#e8f0ea;--mut:#9db0a4;--line:#2a3a31;--pri:#3fbf7a;--pri2:#173326;--err:#ff8a80;--warn:#f0b35a;--sh:none}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#17211b;--ink:#e8f0ea;--mut:#9db0a4;--line:#2a3a31;--pri:#3fbf7a;--pri2:#173326;--err:#ff8a80;--warn:#f0b35a;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
header{background:#0b7a3e;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:700;font-size:13px}
header b{font-size:18px}header small{display:block;opacity:.85;font-size:12px}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:260px 1fr}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh)}
h2{margin:0 0 10px;font-size:18px}
.g{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;font:inherit}
.g.on{border-color:var(--pri);background:var(--pri2)}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:700}
.g small{color:var(--mut);display:block}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.st{font-size:13px;color:var(--mut)}.st b{color:var(--pri)}
.r{display:grid;grid-template-columns:1fr 96px 96px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
@media(max-width:480px){.r{grid-template-columns:1fr 84px}.r .chip{grid-column:1/-1;justify-self:start}}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--pri)}input.bad{border-color:var(--err)}
.msg{grid-column:1/-1;color:var(--err);font-size:13px}
.chip{font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);color:var(--mut);text-align:center}
.chip.borrador{color:var(--warn);border-color:var(--warn)}.chip.guardado{color:var(--pri);border-color:var(--pri);background:var(--pri2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{background:var(--pri2);color:var(--pri);border:1px solid var(--pri);border-radius:16px;padding:4px 10px;font-size:13px;cursor:pointer}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:inherit;border-radius:10px;border:1px solid var(--pri);padding:10px 18px;cursor:pointer;background:var(--pri);color:#fff;font-weight:600}
.btn.sec{background:transparent;color:var(--pri)}.btn:disabled{opacity:.4;cursor:not-allowed}
.ban{display:none;background:#fff4e0;color:#7a4a00;border:1px solid #f0c27a;border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#0b7a3e;color:#fff;padding:12px 18px;border-radius:10px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--mut)}
</style></head><body>
<header><div class="logo">UdeC</div><div><b>Campus Verde Académico</b><small>Módulo del docente · Laura Gómez</small></div></header>
<div class="wrap">
<aside class="card"><h2>Mis grupos</h2><div id="gs"></div><p class="st">Cierre de notas: <b>viernes 5 p. m.</b></p></aside>
<section>
<div class="card"><div class="top"><h2 id="gt" style="margin:0"></h2><span class="st" id="ss">Sin cambios</span></div>
<div class="ban" id="of">Sin conexión. Tus cambios se conservan como borrador y se enviarán al reconectar.</div>
<div id="tb"></div>
<label for="ob" style="display:block;margin-top:12px"><b>Observaciones</b> <small class="st" id="oc">0 / 200</small></label>
<div class="chips" id="ch"></div>
<textarea id="ob" rows="3" maxlength="200" placeholder="Retroalimentación para el grupo"></textarea>
<div class="act"><button class="btn" id="sv" disabled>Guardar notas</button><button class="btn sec" id="un" disabled>Deshacer</button><button class="btn sec" id="cx">Simular caída de conexión</button></div></div>
<div class="card" style="margin-top:16px"><h2>Historial de cambios</h2><ul id="hs"><li>Aún no hay cambios guardados.</li></ul></div>
</section></div>
<div class="toast" id="ts" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const NM=[["Ana Beltrán","Camilo Rojas","Daniela Pardo","Esteban Ruiz","Fabiola Mora","Gabriel Soto"],["Hugo León","Isabel Cruz","Julián Vega","Karen Díaz","Luis Ortiz"],["María Peña","Nicolás Gil","Olga Ramos","Pablo Cano"]];
const GN=["Grupo A · Interfaz Hombre Máquina","Grupo B · Bases de datos","Grupo C · Ingeniería de software"];
const init=[[4.2,3.8,"","","",""],[3.5,4.0,4.5,3.0,4.8],["","","",""]];
const D=NM.map((a,gi)=>({s:a.map((n,i)=>({n,v:init[gi][i]===""?"":String(init[gi][i]),s:init[gi][i]===""?"pendiente":"guardado"})),obs:"",prev:null,hist:[]}));
let cur=0,off=false,tm=null;
const chk=v=>{if(v==="")return null;const x=parseFloat(v.replace(",","."));return !isNaN(x)&&x>=0&&x<=5};
const hr=()=>new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
function toast(t){const e=$("ts");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)}
function side(){$("gs").innerHTML=D.map((g,i)=>{const n=g.s.filter(r=>r.s==="guardado").length,p=Math.round(n/g.s.length*100);return `<button class="g ${i===cur?"on":""}" data-i="${i}"><div class="ring" style="--p:${p}"><span>${p}%</span></div><div><b>${GN[i].split(" · ")[0]}</b><small>${GN[i].split(" · ")[1]}</small><small>${n} de ${g.s.length} notas</small></div></button>`}).join("");document.querySelectorAll(".g").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()})}
function draw(){const g=D[cur];$("gt").textContent=GN[cur];$("tb").innerHTML=g.s.map((r,i)=>`<div class="r"><span>${r.n}</span><input id="i${i}" inputmode="decimal" placeholder="0.0 - 5.0" value="${r.v}" aria-label="Nota de ${r.n}"><span class="chip ${r.s}" id="c${i}">${r.s}</span><div class="msg" id="m${i}" hidden>Escribe un valor entre 0.0 y 5.0 (por ejemplo 3.8).</div></div>`).join("");
g.s.forEach((r,i)=>$("i"+i).addEventListener("input",e=>{const x=D[cur].s[i];x.v=e.target.value;x.s=x.v===""?"pendiente":"borrador";ref();auto()}));
$("ob").value=g.obs;$("oc").textContent=g.obs.length+" / 200";ref();side();rh()}
function ref(){const g=D[cur];let bad=false,dr=0;g.s.forEach((r,i)=>{const b=chk(r.v)===false;bad=bad||b;if(b)r.s="pendiente";$("i"+i).classList.toggle("bad",b);$("m"+i).hidden=!b;if(r.s==="borrador")dr++;const c=$("c"+i);c.textContent=r.s;c.className="chip "+r.s});$("sv").disabled=bad||dr===0;$("un").disabled=!g.prev}
function auto(){$("ss").innerHTML="Escribiendo…";clearTimeout(tm);tm=setTimeout(()=>{$("ss").innerHTML=off?"Borrador local · <b>sin conexión</b>":"Borrador guardado · <b>"+hr()+"</b>"},900)}
$("ob").addEventListener("input",e=>{D[cur].obs=e.target.value;$("oc").textContent=e.target.value.length+" / 200";auto()});
$("ch").innerHTML=["Excelente participación","Debe reforzar el taller 2","Entregó fuera de plazo","Buen trabajo en equipo"].map(t=>`<button type="button">${t}</button>`).join("");
document.querySelectorAll("#ch button").forEach(b=>b.onclick=()=>{const o=$("ob");const v=(o.value?o.value+" ":"")+b.textContent+".";o.value=v.slice(0,200);o.dispatchEvent(new Event("input"))});
$("sv").onclick=()=>{const g=D[cur];if(off){toast("Sin conexión: se mantiene como borrador");return}g.prev=JSON.parse(JSON.stringify(g.s));let n=0;g.s.forEach(r=>{if(r.s==="borrador"){r.s="guardado";n++}});g.hist.unshift(n+" nota(s) guardadas a las "+hr());rh();ref();side();for(let i=0;i<g.s.length;i++){$("c"+i).textContent=g.s[i].s;$("c"+i).className="chip "+g.s[i].s}$("ss").innerHTML="Guardado · <b>"+hr()+"</b>";toast("✓ Notas guardadas a las "+hr())};
$("un").onclick=()=>{const g=D[cur];g.s=g.prev;g.prev=null;g.hist.unshift("Cambio deshecho a las "+hr());rh();draw();toast("Último guardado deshecho")};
$("cx").onclick=()=>{off=!off;$("of").style.display=off?"block":"none";$("cx").textContent=off?"Restablecer conexión":"Simular caída de conexión";if(!off){toast("Conexión restablecida. Ya puedes guardar.");auto()}};
function rh(){$("hs").innerHTML=D[cur].hist.map(h=>"<li>"+h+"</li>").join("")||"<li>Aún no hay cambios guardados.</li>"}
draw();
</script></body></html>
